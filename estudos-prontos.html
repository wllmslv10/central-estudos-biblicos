<script>
const studies=[
{id:'jose',title:'José e o perdão',text:'Gênesis 50:15–21',kind:'Temático',series:'Vida cristã',objective:'Levar a turma a compreender que perdoar não é chamar o mal de bem, mas recusar a vingança e confiar a Deus o juízo, agindo com sabedoria e limites.',truth:'A injustiça sofrida não precisa governar nossas escolhas; podemos responder sem vingança e reconhecer a providência de Deus sem aprovar o mal.',intro:'Pergunte: “Quando alguém nos fere, como evitar que essa ferida determine todas as nossas atitudes?” Ouça brevemente a turma e apresente José, que sofreu traição dentro da própria família.',context:'José foi vendido pelos irmãos (Gn 37), levado ao Egito e passou por sofrimento antes de ser elevado a uma posição de autoridade (Gn 39–41). Durante a fome, seus irmãos foram ao Egito buscar alimento e acabaram reencontrando José (Gn 42–45). Depois da morte de Jacó, temeram que José se vingasse. Gênesis 50:15–21 registra a resposta dele.',points:[['1. Reconheça a dor e trate o medo com verdade — Gênesis 50:15–18','Os irmãos reconhecem a gravidade do que fizeram e temem retaliação. A reconciliação não exige fingir que nada aconteceu. O texto mostra pessoas confrontadas com culpa e medo.'],['2. Renuncie à vingança e deixe o juízo final com Deus — Gênesis 50:19','“Porventura estou eu em lugar de Deus?” José não declara o mal irrelevante; ele rejeita a vingança pessoal e reconhece que o juízo último pertence a Deus.'],['3. Reconheça a providência de Deus sem chamar o mal de bem — Gênesis 50:20','Os irmãos intentaram o mal, mas Deus conduziu a história para preservar vidas. O propósito de Deus não absolve a responsabilidade humana nem torna correta a maldade.'],['4. Demonstre o perdão com atitudes concretas — Gênesis 50:21','José consola os irmãos e promete cuidar deles e de seus filhos. Sua resposta vai além de palavras: ele oferece cuidado em vez de retaliação.']],application:'• Reconheça a ferida sem minimizar o que aconteceu. • Renuncie à vingança e busque agir com justiça. • Entenda que perdão não significa confiança automática ou ausência de limites. • Em situações de abuso, ameaça ou perigo, procure proteção e ajuda responsável. • Peça a Deus sabedoria para responder de modo coerente com a fé.',questions:['O que os irmãos de José temiam depois da morte de Jacó?','Por que José pergunta se está no lugar de Deus?','Como distinguir perdão de aprovação da injustiça?','Que limites sábios podem ser necessários mesmo quando buscamos perdoar?'],conclusion:'José não negou a história dolorosa, mas também não permitiu que a vingança definisse sua resposta. Deus pode agir em meio ao mal sem que o mal deixe de ser mau. Convide a turma a pensar em uma resposta concreta que substitua a retaliação por uma atitude justa e sábia.',prayer:'Senhor, ajuda-nos a reconhecer nossas feridas sem sermos governados pela vingança. Dá-nos coragem para perdoar, sabedoria para estabelecer limites e confiança em tua justiça. Amém.',refs:'Gênesis 37; 39–45; Romanos 12:17–21; Efésios 4:31–32.'},
{id:'oracao',title:'Aprendendo a orar',text:'Mateus 6:5–13',kind:'Temático',series:'Vida cristã',objective:'Ensinar que a oração é relacionamento sincero com Deus, centrado em sua glória, dependência e vontade.',truth:'Jesus ensina seus discípulos a orar com sinceridade, confiança e prioridades alinhadas ao Pai.',intro:'Pergunte: “O que pode transformar a oração em rotina vazia? Como Jesus nos orienta a orar?”',context:'No Sermão do Monte, Jesus corrige práticas religiosas feitas para receber aprovação humana e ensina seus discípulos a buscar a Deus com sinceridade. A oração-modelo apresenta prioridades, dependência e perdão.',points:[['1. Ore com sinceridade, não para impressionar pessoas — Mateus 6:5–6','Jesus condena a exibição religiosa. A oração é dirigida ao Pai, mesmo quando é feita em público com a comunidade.'],['2. Confie no Pai, sem repetir palavras vazias — Mateus 6:7–8','A confiança não depende de convencer Deus com fórmulas. Ele conhece nossas necessidades antes de pedirmos.'],['3. Coloque o Reino e a vontade de Deus em primeiro lugar — Mateus 6:9–10','O nome de Deus, seu reino e sua vontade orientam os pedidos. A oração reorganiza nossas prioridades.'],['4. Apresente a Deus suas necessidades e busque perdão e proteção — Mateus 6:11–13','O pão cotidiano, o perdão e o pedido de livramento mostram dependência diária e vida reconciliada.']],application:'• Reserve tempo para orar com sinceridade. • Comece adorando a Deus e submetendo seus planos a ele. • Apresente necessidades concretas. • Examine sua disposição de perdoar. • Ore também por proteção contra a tentação.',questions:['Qual é a diferença entre oração sincera e oração para aparecer?','O que significa pedir que venha o reino de Deus?','Por que Jesus inclui o perdão na oração?','Que aspecto da oração você precisa praticar mais?'],conclusion:'A oração ensinada por Jesus não é uma fórmula mágica, mas um modelo de prioridades e dependência. Incentive cada aluno a praticar uma oração simples, sincera e diária.',prayer:'Pai nosso, ensina-nos a buscar tua glória e tua vontade. Supre nossas necessidades, perdoa-nos e ajuda-nos a perdoar. Guarda-nos na tentação e guia-nos em teus caminhos. Amém.',refs:'Mateus 6:5–13; Lucas 11:1–4; Filipenses 4:6–7.'},
{id:'fe',title:'Fé em meio às dificuldades',text:'Tiago 1:2–8',kind:'Temático',series:'Vida cristã',objective:'Ajudar a turma a compreender como as provações podem amadurecer a perseverança e por que devemos pedir sabedoria a Deus.',truth:'A fé cristã não nega a dificuldade; busca em Deus sabedoria para perseverar nela.',intro:'Pergunte: “Uma dificuldade sempre significa que Deus nos abandonou?” Explique que o texto chama à perseverança, não a fingir alegria ou ignorar o sofrimento.',context:'Tiago escreve a comunidades cristãs que enfrentavam dispersão e provações. Ele orienta os leitores a responderem com perseverança e a pedirem sabedoria a Deus.',points:[['1. Persevere, permitindo que a provação amadureça sua fé — Tiago 1:2–4','Tiago aponta para o fruto que pode surgir da provação. Isso não torna o sofrimento agradável nem significa que toda situação difícil seja boa em si mesma.'],['2. Peça sabedoria a Deus — Tiago 1:5','A necessidade não é apenas sair rapidamente da dificuldade, mas discernir como agir fielmente nela. Deus é descrito como generoso ao dar sabedoria.'],['3. Busque a Deus com fé e firmeza — Tiago 1:6–8','A imagem da onda ressalta a instabilidade de quem se divide entre confiar em Deus e abandonar sua orientação. O contexto trata de buscar sabedoria com fé.']],application:'• Não esconda a dor nem condene quem está sofrendo. • Peça sabedoria antes de agir impulsivamente. • Busque apoio de irmãos maduros e ajuda profissional quando necessária. • Avalie o que pode ser aprendido sem chamar o mal de bem.',questions:['O que Tiago diz que a perseverança pode produzir?','Que diferença existe entre pedir sabedoria e exigir uma solução imediata?','Como a comunidade pode apoiar quem atravessa provações?'],conclusion:'A fé não é ausência de perguntas ou sofrimento. É depender de Deus e buscar sabedoria para continuar caminhando com fidelidade.',prayer:'Deus, dá-nos sabedoria nas provações, sustenta os cansados e ensina-nos a apoiar uns aos outros com compaixão e perseverança. Amém.',refs:'Tiago 1:2–8; Romanos 5:3–5; 1 Pedro 1:6–7.'},
{id:'samaritano',title:'O próximo que demonstra misericórdia',text:'Lucas 10:25–37',kind:'Temático',series:'Ensinamentos de Jesus',objective:'Mostrar que o amor ao próximo se expressa em misericórdia prática, atravessando barreiras e indo além de palavras.',truth:'O próximo é aquele a quem respondemos com misericórdia concreta.',intro:'Pergunte: “Quem costuma ficar invisível quando estamos com pressa?” Apresente a pergunta do intérprete da lei e a parábola de Jesus.',context:'Um intérprete da lei pergunta a Jesus sobre a vida eterna e, depois, procura justificar a si mesmo perguntando quem é seu próximo. Jesus responde com uma parábola que inverte a expectativa dos ouvintes.',points:[['1. Não ignore quem está ferido e precisa de ajuda — Lucas 10:30–32','O homem ferido está vulnerável. Os que passam adiante mostram que conhecer deveres religiosos não garante uma resposta misericordiosa.'],['2. Demonstre misericórdia além das barreiras — Lucas 10:33–35','O samaritano se aproxima, cuida das feridas, transporta o homem e paga pelo atendimento. A compaixão torna-se ação concreta e custosa.'],['3. Seja próximo de quem precisa, praticando misericórdia — Lucas 10:36–37','A pergunta deixa de ser apenas “quem merece ser meu próximo?” e passa a ser “como posso agir como próximo?”.']],application:'• Perceba necessidades reais ao redor. • Ajude de modo concreto e seguro. • Não use diferenças sociais, culturais ou religiosas como desculpa para indiferença. • Quando a necessidade ultrapassar seus recursos, conecte a pessoa a quem possa ajudar.',questions:['Por que a parábola surpreenderia os ouvintes?','Quais ações concretas mostram a misericórdia do samaritano?','Como ajudar com sabedoria e segurança hoje?'],conclusion:'Jesus liga o amor ao próximo a uma misericórdia que se move, cuida e assume responsabilidade. Convide a turma a identificar uma ação concreta de cuidado nesta semana.',prayer:'Senhor Jesus, livra-nos da indiferença. Abre nossos olhos às necessidades e dá-nos sabedoria e coragem para praticar misericórdia. Amém.',refs:'Lucas 10:25–37; Levítico 19:18; Miqueias 6:8.'},
{id:'fruto',title:'O fruto do Espírito',text:'Gálatas 5:16–26',kind:'Temático',series:'Vida cristã',objective:'Explicar o contraste entre as obras da carne e o fruto do Espírito e incentivar uma vida guiada pelo Espírito Santo.',truth:'A vida guiada pelo Espírito produz um caráter que reflete o caráter de Cristo.',intro:'Pergunte: “Como podemos reconhecer crescimento espiritual além do conhecimento que alguém possui?”',context:'Paulo escreve às igrejas da Galácia e enfatiza que a vida cristã não se resume a regras externas. O trecho contrasta práticas que destroem relacionamentos com o fruto produzido pelo Espírito.',points:[['1. Ande no Espírito em vez de ser guiado por desejos pecaminosos — Gálatas 5:16–18','Paulo chama os cristãos a caminhar guiados pelo Espírito, em vez de se submeterem aos desejos que os afastam de Deus.'],['2. Rejeite práticas que destroem a vida e a comunhão — Gálatas 5:19–21','A lista inclui práticas e atitudes que destroem a comunhão. Ela deve conduzir ao exame sincero e ao arrependimento, não à superioridade sobre os outros.'],['3. Cultive o fruto do Espírito no caráter e nos relacionamentos — Gálatas 5:22–26','Amor, alegria, paz, paciência, bondade, fidelidade, mansidão e domínio próprio descrevem uma vida moldada pelo Espírito.']],application:'• Escolha uma qualidade do fruto para praticar intencionalmente. • Observe como suas palavras afetam os relacionamentos. • Confesse atitudes destrutivas e busque reconciliação quando apropriado. • Avalie o crescimento ao longo do tempo, sem exigir perfeição instantânea.',questions:['Qual contraste Paulo apresenta no texto?','Por que o fruto afeta a convivência com outras pessoas?','Qual qualidade precisa aparecer mais em suas atitudes nesta semana?'],conclusion:'O fruto do Espírito não é apenas uma lista para memorizar; descreve o caráter que deve crescer na comunidade cristã. Convide cada aluno a orar e agir para cultivar esse fruto.',prayer:'Espírito Santo, guia nossos passos e transforma nosso caráter. Produz em nós amor, paz, paciência, bondade, fidelidade, mansidão e domínio próprio. Amém.',refs:'Gálatas 5:16–26; João 15:1–8; Colossenses 3:12–15.'},
{id:'serie-evangelho',title:'Série: Conhecendo o evangelho',text:'Curso em 4 encontros',kind:'Série',series:'Fundamentos da fé',objective:'Apresentar, em quatro encontros, a mensagem bíblica sobre Deus, o pecado, Cristo e a resposta de fé.',truth:'O evangelho anuncia a ação de Deus em Cristo para reconciliar consigo pecadores e formar um povo que vive em novidade de vida.',intro:'Use a série como percurso de quatro aulas; cada encontro deve ser estudado no contexto das passagens indicadas.',context:'Série introdutória para turma de novos convertidos, classe de fundamentos ou estudo em pequenos grupos.',points:[['Encontro 1 — Deus e sua criação','Leituras: Gênesis 1:1–31; Salmo 19:1–6. Objetivo: reconhecer Deus como Criador e compreender a dignidade da vida humana.'],['Encontro 2 — O pecado e a necessidade humana','Leituras: Gênesis 3:1–24; Romanos 3:9–23. Objetivo: compreender a ruptura causada pelo pecado e a necessidade de reconciliação.'],['Encontro 3 — Jesus Cristo e a salvação','Leituras: Marcos 10:45; Romanos 5:6–11; 1 Coríntios 15:1–5. Objetivo: estudar a morte e a ressurreição de Cristo no anúncio do evangelho.'],['Encontro 4 — Resposta de fé e nova vida','Leituras: Efésios 2:1–10; Romanos 10:8–13; Gálatas 5:16–25. Objetivo: conversar sobre fé, graça e vida transformada.']],application:'Ao final de cada encontro, peça aos participantes que resumam a verdade central com suas próprias palavras e formulem uma pergunta que ainda precisam estudar. Evite apressar dúvidas pessoais ou transformar o curso em mera memorização.',questions:['O que aprendemos sobre Deus e a humanidade?','Por que a Bíblia apresenta o pecado como um problema real?','Qual é o lugar de Jesus no evangelho?','Como a graça se relaciona com a nova vida?'],conclusion:'Retome os quatro encontros e mostre como as passagens formam um percurso. Reserve espaço para perguntas e para continuar estudando a Bíblia com a comunidade.',prayer:'Deus, dá-nos entendimento da tua Palavra, fé em Cristo e disposição para viver de modo coerente com o evangelho. Amém.',refs:'Gênesis 1–3; Romanos 3–5; 1 Coríntios 15; Efésios 2.'},
{id:'serie-jesus',title:'Série: Encontros com Jesus',text:'Curso em 4 encontros',kind:'Série',series:'Ensinamentos de Jesus',objective:'Estudar quatro episódios dos Evangelhos e observar como Jesus revela o reino de Deus e chama as pessoas à fé e à prática.',truth:'Os encontros com Jesus confrontam nossas expectativas e nos chamam a responder à sua palavra.',intro:'Leia cada episódio completo e situe-o na narrativa do Evangelho antes de discutir aplicações.',context:'Série que pode ser usada em quatro aulas de EBD ou pequenos grupos, com uma passagem principal por encontro.',points:[['Encontro 1 — Nicodemos e o novo nascimento','Texto: João 3:1–21. Foque a necessidade de nascer do alto e a iniciativa de Deus.'],['Encontro 2 — A mulher samaritana','Texto: João 4:1–30, 39–42. Observe como Jesus atravessa barreiras e conduz a conversa à verdadeira adoração.'],['Encontro 3 — Zaqueu','Texto: Lucas 19:1–10. Observe a iniciativa de Jesus e os sinais concretos de mudança na resposta de Zaqueu.'],['Encontro 4 — Tomé e a fé','Texto: João 20:24–29. Considere a dúvida de Tomé no contexto do testemunho da ressurreição.']],application:'Em cada encontro, pergunte: o que o texto revela sobre Jesus, como as pessoas respondem e que resposta o próprio texto convida o leitor a considerar?',questions:['Que surpresa aparece em cada encontro?','Como Jesus conduz cada pessoa à compreensão?','Quais aplicações vêm do texto, e quais seriam apenas nossas suposições?'],conclusion:'Compare as quatro narrativas: cada pessoa chega com uma situação diferente, mas o texto chama o leitor a considerar a identidade de Jesus e a resposta adequada.',prayer:'Senhor Jesus, ajuda-nos a ouvir tua Palavra com humildade, compreender quem tu és e responder com fé e obediência. Amém.',refs:'João 3–4; Lucas 19:1–10; João 20:24–29.'},
{id:'bom-pastor',title:'Jesus, o bom Pastor',text:'João 10:1–18',kind:'Temático',series:'Ensinamentos de Jesus',objective:'Levar a turma a reconhecer o cuidado, a voz e a entrega de Jesus por suas ovelhas, respondendo a ele com confiança.',truth:'Jesus conhece os seus, guia-os e entrega a própria vida por eles.',intro:'Pergunte: “O que diferencia alguém que realmente cuida de nós de alguém que só quer tirar proveito?” Leia João 10:11 e apresente a imagem do pastor.',context:'No Evangelho de João, Jesus usa imagens conhecidas de pastores e ovelhas para revelar sua identidade e confrontar lideranças que não cuidavam do povo. A passagem aponta para sua relação pessoal com os seus e para sua morte voluntária.',points:[['1. Ouça o Pastor que conhece e chama os seus — João 10:1–6, 14','A imagem do pastor comunica familiaridade e direção. O cuidado de Jesus não é distante ou impessoal; ele conhece os que lhe pertencem.'],['2. Entre pela porta que é Cristo e receba vida — João 10:7–10','A figura da porta destaca acesso e proteção. O contraste é com aqueles que exploram e destroem; Jesus veio para dar vida abundante, não para prometer ausência de dificuldades.'],['3. Confie no Bom Pastor que entrega a vida pelas ovelhas — João 10:11–15','Diferente do empregado que abandona o rebanho, Jesus entrega sua vida pelas ovelhas. Seu cuidado é demonstrado por amor sacrificial.'],['4. Siga a voz do Pastor e reconheça sua autoridade — João 10:16–18','Jesus fala de reunir suas ovelhas. Sua entrega não é acidente: ele a apresenta como parte de sua missão recebida do Pai.']],application:'• Aprenda a reconhecer a orientação de Jesus pela leitura responsável das Escrituras. • Confie no cuidado de Cristo sem esperar uma vida sem lutas. • Cuide de outras pessoas sem explorá-las. • Ore por líderes cristãos que protejam e sirvam a comunidade.',questions:['Quais diferenças Jesus apresenta entre o bom pastor e quem abandona as ovelhas?','Como o cuidado de Jesus aparece concretamente no texto?','O que significa ouvir a voz do Pastor no cotidiano?','Como líderes e membros podem cuidar uns dos outros?'],conclusion:'Jesus não é um líder que usa as pessoas para benefício próprio. Ele conhece, guia e se entrega pelos seus. A resposta apropriada é ouvi-lo, confiar nele e refletir seu cuidado.',prayer:'Senhor Jesus, nosso bom Pastor, ajuda-nos a reconhecer tua voz nas Escrituras, confiar em teu cuidado e tratar as pessoas com o mesmo amor e responsabilidade. Amém.',refs:'Salmo 23; Ezequiel 34:11–16; João 10:1–18; 1 Pedro 5:2–4.'},
{id:'sal-e-luz',title:'Sal da terra e luz do mundo',text:'Mateus 5:13–16',kind:'Temático',series:'Sermão do Monte',objective:'Mostrar que os discípulos de Jesus são chamados a viver de modo visível e fiel, promovendo o bem e apontando para a glória de Deus.',truth:'A vida dos discípulos deve tornar visível a bondade de Deus e conduzir outros a glorificá-lo.',intro:'Pergunte: “Como nossas atitudes podem influenciar um ambiente sem chamar atenção para nós mesmos?” Leia Mateus 5:13–16.',context:'Essas imagens aparecem no início do Sermão do Monte, depois das bem-aventuranças. Jesus descreve a identidade e a responsabilidade de seus discípulos diante do mundo.',points:[['1. Preserve sua influência como sal da terra — Mateus 5:13','A imagem ressalta influência e utilidade. Jesus alerta que o sal sem sua característica perde o propósito; os discípulos não devem abandonar a fidelidade que marca sua vida.'],['2. Não esconda a luz que Deus colocou em você — Mateus 5:14–15','A luz torna possível enxergar. A fé não é exibicionismo religioso, mas também não deve ser ocultada por vergonha ou incoerência.'],['3. Pratique boas obras para glorificar o Pai — Mateus 5:16','O objetivo não é construir fama pessoal. A vida coerente dos discípulos deve levar as pessoas a reconhecerem a bondade de Deus.']],application:'• Seja honesto mesmo quando ninguém está observando. • Pratique generosidade sem buscar aplausos. • Contribua para que sua casa, trabalho e igreja sejam ambientes de cuidado. • Ao fazer o bem, direcione a honra a Deus.',questions:['O que as imagens do sal e da luz ensinam sobre a responsabilidade cristã?','Qual é a diferença entre testemunho e busca de reconhecimento?','Que boa obra pode ser praticada nesta semana?'],conclusion:'Jesus chama seus discípulos a uma fé que transforma a vida cotidiana. Nossas ações não substituem a mensagem do evangelho, mas podem torná-la visível e conduzir outros a glorificar o Pai.',prayer:'Pai, que nossa vida demonstre tua bondade. Livra-nos do orgulho e ajuda-nos a praticar o bem com fidelidade, para que teu nome seja glorificado. Amém.',refs:'Mateus 5:1–16; Filipenses 2:14–16; 1 Pedro 2:11–12.'},
{id:'armadura-de-deus',title:'A armadura de Deus',text:'Efésios 6:10–18',kind:'Temático',series:'Vida cristã',objective:'Ensinar que a firmeza cristã depende da força do Senhor e de recursos espirituais descritos por Paulo com a imagem da armadura.',truth:'A resistência cristã se apoia no Senhor, na verdade, na justiça, no evangelho, na fé, na salvação, na Palavra e na oração.',intro:'Pergunte: “Que recursos ajudam alguém a permanecer firme quando enfrenta pressão, tentação ou desânimo?” Explique que Paulo usa a figura de uma armadura para falar da vida espiritual.',context:'Efésios apresenta a obra de Deus em Cristo e a nova vida da igreja. No capítulo 6, Paulo conclui com orientações para permanecer firme diante das forças do mal, usando a imagem de equipamentos de um soldado.',points:[['1. Fortaleça-se no Senhor e permaneça firme — Efésios 6:10–13','Paulo não incentiva autoconfiança orgulhosa. A ordem é fortalecer-se no Senhor e permanecer firme, reconhecendo que a luta não se reduz a conflitos humanos.'],['2. Vista a verdade e a justiça e esteja pronto para o evangelho — Efésios 6:14–15','A imagem do cinto e da couraça destaca integridade e justiça. Os pés preparados com o evangelho da paz lembram que a mensagem de Cristo orienta os passos.'],['3. Use o escudo da fé, a salvação e a Palavra de Deus — Efésios 6:16–17','A fé protege contra ataques que procuram destruir a confiança em Deus; a esperança da salvação e a Palavra sustentam a resistência fiel.'],['4. Persevere em oração por todos os santos — Efésios 6:18','A oração acompanha toda a imagem da armadura. Paulo chama à vigilância e à intercessão perseverante por todos os santos.']],application:'• Responda à mentira com a verdade. • Pratique justiça e integridade. • Relembre as promessas bíblicas com contexto. • Cultive oração regular e intercessão pela igreja. • Não transforme pessoas em inimigos absolutos: a passagem alerta para uma luta espiritual.',questions:['Por que Paulo começa falando da força do Senhor?','Como verdade e justiça se relacionam com a vida diária?','Qual é o papel da Palavra e da oração na perseverança?','Como evitar usar essa passagem para tratar pessoas como inimigas?'],conclusion:'A armadura descreve uma vida inteira sustentada por Deus, não uma fórmula mágica. O cristão permanece firme por meio da verdade, da justiça, do evangelho, da fé, da salvação, da Palavra e da oração.',prayer:'Senhor, fortalece-nos em ti. Ajuda-nos a viver na verdade, praticar justiça, confiar no evangelho, guardar a fé e perseverar em oração. Amém.',refs:'Efésios 6:10–18; Romanos 13:12–14; 1 Tessalonicenses 5:8–11.'},
{id:'ressurreicao',title:'A ressurreição de Jesus',text:'1 Coríntios 15:1–11, 20–22',kind:'Temático',series:'Fundamentos da fé',objective:'Apresentar a centralidade da morte e ressurreição de Cristo e suas consequências para a esperança e a fé cristã.',truth:'A ressurreição de Jesus está no centro do evangelho e fundamenta a esperança cristã.',intro:'Pergunte: “O que mudaria na fé cristã se Jesus não tivesse ressuscitado?” Leia a passagem e observe como Paulo apresenta o evangelho recebido e anunciado.',context:'Paulo escreve à igreja de Corinto para responder a dúvidas sobre a ressurreição dos mortos. Antes de explicar suas consequências, recorda o núcleo da mensagem cristã: Cristo morreu pelos pecados, foi sepultado e ressuscitou, conforme as Escrituras.',points:[['1. Permaneça firme no evangelho que recebeu — 1 Coríntios 15:1–2','Paulo recorda a mensagem que anunciou e que os coríntios receberam. A fé cristã está ligada a um anúncio concreto, não apenas a sentimentos religiosos.'],['2. Mantenha a morte e a ressurreição de Cristo no centro da fé — 1 Coríntios 15:3–8','Paulo menciona a morte pelos pecados, o sepultamento, a ressurreição e as aparições a testemunhas. A ressurreição é apresentada como acontecimento fundamental da mensagem.'],['3. Reconheça a graça que transforma e sustenta — 1 Coríntios 15:9–11','Paulo reconhece seu passado e atribui à graça de Deus seu trabalho. A verdade anunciada não dá motivo para orgulho pessoal.'],['4. Viva na esperança da ressurreição em Cristo — 1 Coríntios 15:20–22','A ressurreição de Jesus inaugura a esperança da ressurreição dos que lhe pertencem. Paulo contrasta a morte ligada a Adão com a vida em Cristo.']],application:'• Fundamente a fé no evangelho bíblico, não apenas em experiências pessoais. • Enfrente o luto com esperança sem minimizar a dor. • Lembre que a graça exclui a vanglória. • Viva hoje à luz da esperança da ressurreição.',questions:['Quais elementos Paulo destaca ao resumir o evangelho?','Por que a ressurreição é indispensável à esperança cristã?','Como a graça aparece no testemunho do próprio Paulo?','Como a esperança futura influencia nossas escolhas presentes?'],conclusion:'Para Paulo, a ressurreição não é um detalhe secundário. Ela confirma a vitória de Cristo e sustenta a esperança de vida para os que lhe pertencem. Essa esperança chama a uma fé perseverante e humilde.',prayer:'Deus, obrigado pela morte e ressurreição de Jesus. Sustenta nossa fé, consola os que sofrem e ajuda-nos a viver com esperança, gratidão e fidelidade. Amém.',refs:'1 Coríntios 15:1–22; Lucas 24:1–12; Romanos 6:4–11; 1 Pedro 1:3–5.'},
{id:'serie-oracao',title:'Série: Uma vida de oração',text:'Curso em 4 encontros',kind:'Série',series:'Fundamentos da fé',objective:'Organizar quatro aulas sobre a prática da oração, abordando sinceridade, dependência, perseverança e intercessão.',truth:'A oração cristã é relacionamento reverente e confiante com Deus, moldado por sua Palavra e sua vontade.',intro:'Apresente a série como um convite para aprender com diferentes textos bíblicos, evitando tratar a oração como técnica para controlar resultados.',context:'Os quatro encontros reúnem passagens que mostram o ensino de Jesus, a perseverança na oração, a confiança em Deus e a intercessão pela comunidade.',points:[['Encontro 1 — Aprendendo com Jesus','Texto: Mateus 6:5–13. Estude a sinceridade diante do Pai, a oração-modelo e as prioridades do reino de Deus.'],['Encontro 2 — Perseverar sem desanimar','Texto: Lucas 18:1–8. Observe a parábola e a chamada de Jesus para orar sempre, mantendo a confiança na justiça de Deus.'],['Encontro 3 — Orar em meio à ansiedade','Texto: Filipenses 4:4–9. Examine a relação entre oração, súplica, gratidão e a paz de Deus no contexto da carta.'],['Encontro 4 — Interceder uns pelos outros','Texto: Efésios 6:18–20; Colossenses 4:2–4. Converse sobre vigilância, perseverança e oração pela missão e pelos irmãos.']],application:'Ao final de cada encontro, incentive a turma a montar uma prática realista de oração: um horário, uma passagem bíblica, pedidos específicos e nomes de pessoas pelas quais interceder. Não prometa que toda oração será respondida exatamente como desejamos.',questions:['O que Jesus corrige sobre a oração?','Por que perseverar não significa tentar obrigar Deus a agir?','Como gratidão e súplica aparecem juntas?','Por quem a igreja deve interceder além de suas próprias necessidades?'],conclusion:'A série mostra que a oração é aprendida na presença de Deus e vivida em confiança, perseverança, gratidão e amor ao próximo. Incentive a continuidade da prática depois das quatro aulas.',prayer:'Pai, ensina-nos a orar com sinceridade e perseverança. Dá-nos confiança em tua sabedoria e lembra-nos de interceder por todos os que precisam de cuidado. Amém.',refs:'Mateus 6:5–13; Lucas 18:1–8; Filipenses 4:4–9; Efésios 6:18–20.'},
{"id":"davi-golias","title":"Davi e Golias: coragem que confia em Deus","text":"1 Samuel 17:32–50","kind":"Personagens bíblicos","series":"Fé em ação","objective":"A confiança no Senhor sustenta a coragem diante de desafios.","truth":"Davi enfrentou Golias confiando no Senhor, recordando a ajuda divina e recusando depender apenas das aparências.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Israel temia o desafio de Golias. Davi, ainda jovem, ofereceu-se para enfrentá-lo e explicou que já havia experimentado o cuidado de Deus.","points":[["1.","Davi viu o perigo, mas não foi dominado pelo medo. "],["2.","Recordou livramentos anteriores. "],["3.","Agiu com os recursos que conhecia. "],["4.","Atribuiu ao Senhor a vitória."]],"application":"Confiar em Deus não dispensa preparo e responsabilidade. Pense em desafios enfrentados com oração, coragem e ações sábias.","questions":["Como Davi respondeu ao medo?","O que ele recordou?","Como confiar em Deus hoje?"],"conclusion":"A fé olha para a grandeza de Deus, não apenas para o tamanho do problema.","prayer":"Senhor, dá-nos coragem, humildade e confiança em ti. Amém.","refs":"1 Samuel 17:32–50; Salmo 56:3–4."},
{"id":"ester-coragem","title":"Ester: coragem para agir no momento certo","text":"Ester 4:10–17","kind":"Personagens bíblicos","series":"Fé em ação","objective":"Ensinar coragem responsável em favor de outras pessoas.","truth":"Ester considerou o risco, buscou apoio e decidiu agir em favor de seu povo.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"O povo judeu corria perigo. Ester era rainha, mas aproximar-se do rei sem ser chamada poderia custar-lhe a vida.","points":[["1.","Ester ouviu a gravidade da situação. "],["2.","Reconheceu o risco. "],["3.","Pediu que o povo jejuasse. "],["4.","Decidiu agir apesar do perigo."]],"application":"Coragem não é ausência de medo. É agir com discernimento quando algo justo e necessário precisa ser feito.","questions":["Qual era o risco?","Por que Ester pediu jejum?","Como podemos defender alguém com prudência?"],"conclusion":"Nossa posição pode ser uma oportunidade de servir e proteger.","prayer":"Deus, concede-nos coragem e discernimento para fazer o bem. Amém.","refs":"Ester 4:10–17; Provérbios 31:8–9."},
{"id":"daniel-fidelidade","title":"Daniel: fidelidade sob pressão","text":"Daniel 6:6–23","kind":"Personagens bíblicos","series":"Fé em ação","objective":"Encorajar a perseverança na fé quando há pressão para abandoná-la.","truth":"Daniel permaneceu fiel a Deus apesar de uma lei injusta e das consequências.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Os adversários de Daniel criaram uma lei para impedir sua oração. Daniel continuou a buscar a Deus como de costume.","points":[["1.","A integridade de Daniel provocou oposição. "],["2.","Ele não abandonou sua prática de fé. "],["3.","Enfrentou as consequências sem vingança. "],["4.","Deus o livrou."]],"application":"Aplique à oração, honestidade e compromisso cristão. Confiar em Deus não significa que nunca haverá sofrimento.","questions":["O que os adversários fizeram?","Como Daniel respondeu?","Como manter a fé com respeito?"],"conclusion":"A fidelidade diária prepara o coração para os momentos difíceis.","prayer":"Senhor, ajuda-nos a permanecer fiéis com coragem e integridade. Amém.","refs":"Daniel 6:6–23; Atos 5:29."},
{"id":"noe-obediencia","title":"Noé: obediência e recomeço","text":"Gênesis 6:9–22; 8:15–22","kind":"Personagens bíblicos","series":"Começos com Deus","objective":"Mostrar a importância da obediência perseverante e da gratidão nos recomeços.","truth":"Noé obedeceu a Deus e respondeu a uma nova etapa com adoração.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Gênesis apresenta Noé como alguém que andava com Deus em uma geração corrompida. Após o dilúvio, ele recebeu a oportunidade de recomeçar.","points":[["1.","Noé andava com Deus. "],["2.","Obedeceu às instruções recebidas. "],["3.","Esperou pela orientação divina. "],["4.","Ao sair, adorou a Deus."]],"application":"Recomeçar não é ignorar o passado; é responder com fé, responsabilidade e gratidão.","questions":["Como Noé é descrito?","O que exigiu perseverança?","Como ele respondeu ao recomeço?"],"conclusion":"A fé perseverante também se expressa em gratidão.","prayer":"Deus, ensina-nos a obedecer e a reconhecer tua bondade em cada recomeço. Amém.","refs":"Gênesis 6:9–22; 8:15–22; Hebreus 11:7."},
{"id":"filho-prodigo","title":"O pai misericordioso e os dois filhos","text":"Lucas 15:11–32","kind":"Parábolas de Jesus","series":"Graça e misericórdia","objective":"Mostrar a misericórdia do pai e o perigo do orgulho ressentido.","truth":"Deus chama ao arrependimento e confronta quem se recusa a celebrar a misericórdia.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Jesus contou a parábola em resposta às críticas porque recebia pecadores. A história apresenta o filho mais novo, o pai e o filho mais velho.","points":[["1.","O filho mais novo afastou-se e sofreu consequências. "],["2.","Reconheceu sua condição e voltou. "],["3.","O pai o recebeu com compaixão. "],["4.","O irmão mais velho ressentiu-se da restauração."]],"application":"Arrependimento é mais que remorso. Acolher com misericórdia não exige negar a verdade nem abandonar limites seguros.","questions":["O que levou o filho a voltar?","Como o pai respondeu?","Por que o irmão mais velho ficou ressentido?"],"conclusion":"A graça nos convida a voltar e a abandonar o orgulho diante da restauração alheia.","prayer":"Pai, ajuda-nos a voltar para ti e receber os outros com misericórdia. Amém.","refs":"Lucas 15:11–32; Salmo 103:8–13."},
{"id":"semeador","title":"A parábola do semeador: como recebemos a Palavra","text":"Marcos 4:1–20","kind":"Parábolas de Jesus","series":"Discipulado","objective":"Ensinar que ouvir a Palavra envolve acolher, perseverar e frutificar.","truth":"A Palavra frutifica em quem a recebe com coração receptivo e perseverante.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Jesus usou uma imagem agrícola conhecida para mostrar diferentes respostas à Palavra de Deus.","points":[["1.","A semente é lançada. "],["2.","O caminho representa a Palavra não acolhida. "],["3.","Pedras e espinhos ilustram obstáculos. "],["4.","A boa terra ouve, acolhe e frutifica."]],"application":"Identifique distrações e preocupações que dificultam a obediência. Incentive leitura bíblica, oração e prática constante.","questions":["O que representa a semente?","Quais obstáculos aparecem?","Como cultivar uma vida frutífera?"],"conclusion":"Não basta ouvir superficialmente; somos chamados a praticar a Palavra.","prayer":"Senhor, prepara nosso coração para receber tua Palavra e produzir fruto. Amém.","refs":"Marcos 4:1–20; Tiago 1:22–25."},
{"id":"nascimento-jesus","title":"O nascimento de Jesus e a boa notícia de esperança","text":"Lucas 2:1–20","kind":"Vida de Jesus","series":"Evangelho","objective":"Apresentar o nascimento de Jesus como boa notícia de grande alegria.","truth":"Em Jesus, Deus anuncia salvação e esperança para o povo.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Lucas relata o nascimento de Jesus e o anúncio dos anjos a pastores que estavam no campo.","points":[["1.","Jesus nasceu em circunstâncias humildes. "],["2.","O anúncio trouxe temor e glória. "],["3.","A mensagem era boa notícia de grande alegria. "],["4.","Os pastores foram ver e divulgar o que ouviram."]],"application":"A esperança cristã não depende de prestígio social. Incentive a compartilhar a mensagem de Jesus e acolher pessoas de diferentes condições.","questions":["Quem recebeu o anúncio?","Qual foi a mensagem?","Como os pastores responderam?"],"conclusion":"A boa notícia de Jesus traz esperança e chama ao testemunho.","prayer":"Deus, obrigado por Jesus. Ajuda-nos a viver na esperança e compartilhar as boas-novas. Amém.","refs":"Lucas 2:1–20; Isaías 9:2–7."},
{"id":"tentacao-jesus","title":"Jesus enfrenta a tentação com fidelidade","text":"Mateus 4:1–11","kind":"Vida de Jesus","series":"Discipulado","objective":"Mostrar como Jesus permaneceu fiel à Palavra e à vontade do Pai.","truth":"Jesus rejeitou atalhos e respondeu à tentação com fidelidade a Deus.","intro":"Inicie com uma pergunta que conecte o tema à experiência da turma. Leia a passagem bíblica indicada e convide os participantes a observar o que o texto realmente diz.","context":"Após o batismo, Jesus foi ao deserto, jejuou e foi tentado. Suas respostas recorreram às Escrituras.","points":[["1.","A tentação atingiu necessidades reais. "],["2.","Jesus rejeitou atalhos. "],["3.","Recusou testar a Deus. "],["4.","Não trocou adoração por poder."]],"application":"Incentive oração, conhecimento bíblico, apoio de pessoas maduras e afastamento de situações que alimentam a tentação.","questions":["Quais foram as tentações?","Como Jesus respondeu?","O que ajuda a resistir ao mal?"],"conclusion":"A fidelidade a Deus vale mais que atalhos que prometem poder ou satisfação.","prayer":"Pai, dá-nos discernimento e força para rejeitar o mal. Amém.","refs":"Mateus 4:1–11; 1 Coríntios 10:13."}
];

function openStudy(id){current=studies.find(x=>x.id===id);if(!current)return;$('#catalog').classList.add('hidden');$('#detail').classList.remove('hidden');const x=current;$('#detail').innerHTML='<span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h1>'+esc(x.title)+'</h1><p><strong>Texto principal:</strong> '+esc(x.text)+'</p><div class="truth"><strong>Verdade central</strong><br>'+esc(x.truth)+'<br><br><strong>Objetivo</strong><br>'+esc(x.objective)+'</div><section><h2>1. Introdução</h2><p>'+esc(x.intro)+'</p></section><section><h2>2. Contexto bíblico</h2><p>'+esc(x.context)+'</p></section><section><h2>3. Desenvolvimento do estudo</h2>'+x.points.map(p=>'<h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p>').join('')+'</section><section><h2>4. Aplicações práticas</h2><p>'+esc(x.application)+'</p></section><section><h2>5. Perguntas para a turma</h2><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol></section><section><h2>6. Conclusão</h2><p>'+esc(x.conclusion)+'</p></section><section><h2>7. Oração sugerida</h2><p>'+esc(x.prayer)+'</p></section><section><h2>Leituras complementares</h2><p>'+esc(x.refs)+'</p></section><div class="top no-print"><button class="soft" id="back">← Voltar aos estudos</button><button class="gold" id="print2">🖨️ Imprimir / salvar PDF</button><button class="primary" id="copy2">📋 Copiar para minha biblioteca</button><button class="primary" id="makeSlides">📽️ Criar apresentação HTML</button><button class="gold" id="downloadSlides">⬇️ Baixar apresentação HTML</button></div>';$('#back').onclick=back;$('#print2').onclick=()=>window.print();$('#copy2').onclick=copyStudy;$('#makeSlides').onclick=()=>openPresentation(false);$('#downloadSlides').onclick=()=>openPresentation(true);window.scrollTo(0,0)}function back(){$('#detail').classList.add('hidden');$('#catalog').classList.remove('hidden');window.scrollTo(0,0)}function copyStudy(){if(!current)return;const x=current;const text='ESTUDOS PRONTOS — '+x.title+'\nTexto: '+x.text+'\nObjetivo: '+x.objective+'\nVerdade central: '+x.truth+'\n\nINTRODUÇÃO\n'+x.intro+'\n\nCONTEXTO BÍBLICO\n'+x.context+'\n\nDESENVOLVIMENTO\n'+x.points.map(p=>p[0]+'\n'+p[1]).join('\n\n')+'\n\nAPLICAÇÕES\n'+x.application+'\n\nPERGUNTAS\n'+x.questions.map((q,i)=>(i+1)+'. '+q).join('\n')+'\n\nCONCLUSÃO\n'+x.conclusion+'\n\nORAÇÃO\n'+x.prayer+'\n\nLEITURAS COMPLEMENTARES\n'+x.refs;const material={id:'estudos-prontos-'+x.id,categoria:'EBD',titulo:x.title,texto:x.text,objetivo:x.objective,chave:x.text,intro:x.intro,contexto:x.context,pontos:x.points.map(p=>p[0]+'\n'+p[1]).join('\n\n'),aplicacao:x.application,perguntas:x.questions.map((q,i)=>(i+1)+'. '+q).join('\n'),conclusao:x.conclusion+'\n\nOração sugerida: '+x.prayer,notas:'Estudo pronto — '+x.kind+' / '+x.series+'\nLeituras complementares: '+x.refs,atualizado:new Date().toISOString()};try{const key='centralEstudosBiblicos.v1',old=JSON.parse(localStorage.getItem(key)||'[]'),idx=old.findIndex(y=>y.id===material.id);if(idx>=0)old[idx]=material;else old.unshift(material);localStorage.setItem(key,JSON.stringify(old));alert('Estudo copiado para Minha biblioteca neste navegador.');}catch(e){try{const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=x.id+'-estudo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Não foi possível gravar na biblioteca deste navegador. Baixei o estudo em arquivo TXT como alternativa.')}catch{alert('Não foi possível copiar ou exportar o estudo.')}}}$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openStudy(b.dataset.id)});$('#kind').onchange=render;$('#search').oninput=render;$('#copy').onclick=copyStudy;render();
