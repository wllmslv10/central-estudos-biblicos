<script>
const studies=[
{id:'jose',title:'José e o perdão',text:'Gênesis 50:15–21',kind:'Temático',series:'Vida cristã',objective:'Levar a turma a compreender que perdoar não é chamar o mal de bem, mas recusar a vingança e confiar a Deus o juízo, agindo com sabedoria e limites.',truth:'A injustiça sofrida não precisa governar nossas escolhas; podemos responder sem vingança e reconhecer a providência de Deus sem aprovar o mal.',intro:'Pergunte: “Quando alguém nos fere, como evitar que essa ferida determine todas as nossas atitudes?” Ouça brevemente a turma e apresente José, que sofreu traição dentro da própria família.',context:'José foi vendido pelos irmãos (Gn 37), levado ao Egito e passou por sofrimento antes de ser elevado a uma posição de autoridade (Gn 39–41). Durante a fome, seus irmãos foram ao Egito buscar alimento e acabaram reencontrando José (Gn 42–45). Depois da morte de Jacó, temeram que José se vingasse. Gênesis 50:15–21 registra a resposta dele.',points:[['1. A dor e o medo precisam ser tratados com verdade (vv. 15–18)','Os irmãos reconhecem a gravidade do que fizeram e temem retaliação. A reconciliação não exige fingir que nada aconteceu. O texto mostra pessoas confrontadas com culpa e medo.'],['2. José recusa tomar o lugar de juiz absoluto (v. 19)','“Porventura estou eu em lugar de Deus?” José não declara o mal irrelevante; ele rejeita a vingança pessoal e reconhece que o juízo último pertence a Deus.'],['3. A providência de Deus não transforma o mal em bem moral (v. 20)','Os irmãos intentaram o mal, mas Deus conduziu a história para preservar vidas. O propósito de Deus não absolve a responsabilidade humana nem torna correta a maldade.'],['4. O perdão se expressa em atitudes concretas (v. 21)','José consola os irmãos e promete cuidar deles e de seus filhos. Sua resposta vai além de palavras: ele oferece cuidado em vez de retaliação.']],application:'• Reconheça a ferida sem minimizar o que aconteceu. • Renuncie à vingança e busque agir com justiça. • Entenda que perdão não significa confiança automática ou ausência de limites. • Em situações de abuso, ameaça ou perigo, procure proteção e ajuda responsável. • Peça a Deus sabedoria para responder de modo coerente com a fé.',questions:['O que os irmãos de José temiam depois da morte de Jacó?','Por que José pergunta se está no lugar de Deus?','Como distinguir perdão de aprovação da injustiça?','Que limites sábios podem ser necessários mesmo quando buscamos perdoar?'],conclusion:'José não negou a história dolorosa, mas também não permitiu que a vingança definisse sua resposta. Deus pode agir em meio ao mal sem que o mal deixe de ser mau. Convide a turma a pensar em uma resposta concreta que substitua a retaliação por uma atitude justa e sábia.',prayer:'Senhor, ajuda-nos a reconhecer nossas feridas sem sermos governados pela vingança. Dá-nos coragem para perdoar, sabedoria para estabelecer limites e confiança em tua justiça. Amém.',refs:'Gênesis 37; 39–45; Romanos 12:17–21; Efésios 4:31–32.'},
{id:'oracao',title:'Aprendendo a orar',text:'Mateus 6:5–13',kind:'Temático',series:'Vida cristã',objective:'Ensinar que a oração é relacionamento sincero com Deus, centrado em sua glória, dependência e vontade.',truth:'Jesus ensina seus discípulos a orar com sinceridade, confiança e prioridades alinhadas ao Pai.',intro:'Pergunte: “O que pode transformar a oração em rotina vazia? Como Jesus nos orienta a orar?”',context:'No Sermão do Monte, Jesus corrige práticas religiosas feitas para receber aprovação humana e ensina seus discípulos a buscar a Deus com sinceridade. A oração-modelo apresenta prioridades, dependência e perdão.',points:[['1. Ore para Deus, não para impressionar pessoas (vv. 5–6)','Jesus condena a exibição religiosa. A oração é dirigida ao Pai, mesmo quando é feita em público com a comunidade.'],['2. Confie em Deus sem multiplicar palavras vazias (vv. 7–8)','A confiança não depende de convencer Deus com fórmulas. Ele conhece nossas necessidades antes de pedirmos.'],['3. Coloque a vontade e o reino de Deus em primeiro lugar (vv. 9–10)','O nome de Deus, seu reino e sua vontade orientam os pedidos. A oração reorganiza nossas prioridades.'],['4. Apresente necessidades, perdão e proteção (vv. 11–13)','O pão cotidiano, o perdão e o pedido de livramento mostram dependência diária e vida reconciliada.']],application:'• Reserve tempo para orar com sinceridade. • Comece adorando a Deus e submetendo seus planos a ele. • Apresente necessidades concretas. • Examine sua disposição de perdoar. • Ore também por proteção contra a tentação.',questions:['Qual é a diferença entre oração sincera e oração para aparecer?','O que significa pedir que venha o reino de Deus?','Por que Jesus inclui o perdão na oração?','Que aspecto da oração você precisa praticar mais?'],conclusion:'A oração ensinada por Jesus não é uma fórmula mágica, mas um modelo de prioridades e dependência. Incentive cada aluno a praticar uma oração simples, sincera e diária.',prayer:'Pai nosso, ensina-nos a buscar tua glória e tua vontade. Supre nossas necessidades, perdoa-nos e ajuda-nos a perdoar. Guarda-nos na tentação e guia-nos em teus caminhos. Amém.',refs:'Mateus 6:5–13; Lucas 11:1–4; Filipenses 4:6–7.'},
{id:'fe',title:'Fé em meio às dificuldades',text:'Tiago 1:2–8',kind:'Temático',series:'Vida cristã',objective:'Ajudar a turma a compreender como as provações podem amadurecer a perseverança e por que devemos pedir sabedoria a Deus.',truth:'A fé cristã não nega a dificuldade; busca em Deus sabedoria para perseverar nela.',intro:'Pergunte: “Uma dificuldade sempre significa que Deus nos abandonou?” Explique que o texto chama à perseverança, não a fingir alegria ou ignorar o sofrimento.',context:'Tiago escreve a comunidades cristãs que enfrentavam dispersão e provações. Ele orienta os leitores a responderem com perseverança e a pedirem sabedoria a Deus.',points:[['1. As provações podem produzir perseverança (vv. 2–4)','Tiago aponta para o fruto que pode surgir da provação. Isso não torna o sofrimento agradável nem significa que toda situação difícil seja boa em si mesma.'],['2. Peça sabedoria a Deus (v. 5)','A necessidade não é apenas sair rapidamente da dificuldade, mas discernir como agir fielmente nela. Deus é descrito como generoso ao dar sabedoria.'],['3. Peça com confiança em Deus (vv. 6–8)','A imagem da onda ressalta a instabilidade de quem se divide entre confiar em Deus e abandonar sua orientação. O contexto trata de buscar sabedoria com fé.']],application:'• Não esconda a dor nem condene quem está sofrendo. • Peça sabedoria antes de agir impulsivamente. • Busque apoio de irmãos maduros e ajuda profissional quando necessária. • Avalie o que pode ser aprendido sem chamar o mal de bem.',questions:['O que Tiago diz que a perseverança pode produzir?','Que diferença existe entre pedir sabedoria e exigir uma solução imediata?','Como a comunidade pode apoiar quem atravessa provações?'],conclusion:'A fé não é ausência de perguntas ou sofrimento. É depender de Deus e buscar sabedoria para continuar caminhando com fidelidade.',prayer:'Deus, dá-nos sabedoria nas provações, sustenta os cansados e ensina-nos a apoiar uns aos outros com compaixão e perseverança. Amém.',refs:'Tiago 1:2–8; Romanos 5:3–5; 1 Pedro 1:6–7.'},
{id:'samaritano',title:'O próximo que demonstra misericórdia',text:'Lucas 10:25–37',kind:'Temático',series:'Ensinamentos de Jesus',objective:'Mostrar que o amor ao próximo se expressa em misericórdia prática, atravessando barreiras e indo além de palavras.',truth:'O próximo é aquele a quem respondemos com misericórdia concreta.',intro:'Pergunte: “Quem costuma ficar invisível quando estamos com pressa?” Apresente a pergunta do intérprete da lei e a parábola de Jesus.',context:'Um intérprete da lei pergunta a Jesus sobre a vida eterna e, depois, procura justificar a si mesmo perguntando quem é seu próximo. Jesus responde com uma parábola que inverte a expectativa dos ouvintes.',points:[['1. A necessidade humana exige atenção (vv. 30–32)','O homem ferido está vulnerável. Os que passam adiante mostram que conhecer deveres religiosos não garante uma resposta misericordiosa.'],['2. A misericórdia ultrapassa barreiras (vv. 33–35)','O samaritano se aproxima, cuida das feridas, transporta o homem e paga pelo atendimento. A compaixão torna-se ação concreta e custosa.'],['3. Jesus chama seus ouvintes a praticar misericórdia (vv. 36–37)','A pergunta deixa de ser apenas “quem merece ser meu próximo?” e passa a ser “como posso agir como próximo?”.']],application:'• Perceba necessidades reais ao redor. • Ajude de modo concreto e seguro. • Não use diferenças sociais, culturais ou religiosas como desculpa para indiferença. • Quando a necessidade ultrapassar seus recursos, conecte a pessoa a quem possa ajudar.',questions:['Por que a parábola surpreenderia os ouvintes?','Quais ações concretas mostram a misericórdia do samaritano?','Como ajudar com sabedoria e segurança hoje?'],conclusion:'Jesus liga o amor ao próximo a uma misericórdia que se move, cuida e assume responsabilidade. Convide a turma a identificar uma ação concreta de cuidado nesta semana.',prayer:'Senhor Jesus, livra-nos da indiferença. Abre nossos olhos às necessidades e dá-nos sabedoria e coragem para praticar misericórdia. Amém.',refs:'Lucas 10:25–37; Levítico 19:18; Miqueias 6:8.'},
{id:'fruto',title:'O fruto do Espírito',text:'Gálatas 5:16–26',kind:'Temático',series:'Vida cristã',objective:'Explicar o contraste entre as obras da carne e o fruto do Espírito e incentivar uma vida guiada pelo Espírito Santo.',truth:'A vida guiada pelo Espírito produz um caráter que reflete o caráter de Cristo.',intro:'Pergunte: “Como podemos reconhecer crescimento espiritual além do conhecimento que alguém possui?”',context:'Paulo escreve às igrejas da Galácia e enfatiza que a vida cristã não se resume a regras externas. O trecho contrasta práticas que destroem relacionamentos com o fruto produzido pelo Espírito.',points:[['1. Há um conflito entre desejos e direção do Espírito (vv. 16–18)','Paulo chama os cristãos a caminhar guiados pelo Espírito, em vez de se submeterem aos desejos que os afastam de Deus.'],['2. As obras da carne prejudicam a vida comunitária (vv. 19–21)','A lista inclui práticas e atitudes que destroem a comunhão. Ela deve conduzir ao exame sincero e ao arrependimento, não à superioridade sobre os outros.'],['3. O fruto do Espírito transforma o caráter e as relações (vv. 22–26)','Amor, alegria, paz, paciência, bondade, fidelidade, mansidão e domínio próprio descrevem uma vida moldada pelo Espírito.']],application:'• Escolha uma qualidade do fruto para praticar intencionalmente. • Observe como suas palavras afetam os relacionamentos. • Confesse atitudes destrutivas e busque reconciliação quando apropriado. • Avalie o crescimento ao longo do tempo, sem exigir perfeição instantânea.',questions:['Qual contraste Paulo apresenta no texto?','Por que o fruto afeta a convivência com outras pessoas?','Qual qualidade precisa aparecer mais em suas atitudes nesta semana?'],conclusion:'O fruto do Espírito não é apenas uma lista para memorizar; descreve o caráter que deve crescer na comunidade cristã. Convide cada aluno a orar e agir para cultivar esse fruto.',prayer:'Espírito Santo, guia nossos passos e transforma nosso caráter. Produz em nós amor, paz, paciência, bondade, fidelidade, mansidão e domínio próprio. Amém.',refs:'Gálatas 5:16–26; João 15:1–8; Colossenses 3:12–15.'},
{id:'serie-evangelho',title:'Série: Conhecendo o evangelho',text:'Curso em 4 encontros',kind:'Série',series:'Fundamentos da fé',objective:'Apresentar, em quatro encontros, a mensagem bíblica sobre Deus, o pecado, Cristo e a resposta de fé.',truth:'O evangelho anuncia a ação de Deus em Cristo para reconciliar consigo pecadores e formar um povo que vive em novidade de vida.',intro:'Use a série como percurso de quatro aulas; cada encontro deve ser estudado no contexto das passagens indicadas.',context:'Série introdutória para turma de novos convertidos, classe de fundamentos ou estudo em pequenos grupos.',points:[['Encontro 1 — Deus e sua criação','Leituras: Gênesis 1:1–31; Salmo 19:1–6. Objetivo: reconhecer Deus como Criador e compreender a dignidade da vida humana.'],['Encontro 2 — O pecado e a necessidade humana','Leituras: Gênesis 3:1–24; Romanos 3:9–23. Objetivo: compreender a ruptura causada pelo pecado e a necessidade de reconciliação.'],['Encontro 3 — Jesus Cristo e a salvação','Leituras: Marcos 10:45; Romanos 5:6–11; 1 Coríntios 15:1–5. Objetivo: estudar a morte e a ressurreição de Cristo no anúncio do evangelho.'],['Encontro 4 — Resposta de fé e nova vida','Leituras: Efésios 2:1–10; Romanos 10:8–13; Gálatas 5:16–25. Objetivo: conversar sobre fé, graça e vida transformada.']],application:'Ao final de cada encontro, peça aos participantes que resumam a verdade central com suas próprias palavras e formulem uma pergunta que ainda precisam estudar. Evite apressar dúvidas pessoais ou transformar o curso em mera memorização.',questions:['O que aprendemos sobre Deus e a humanidade?','Por que a Bíblia apresenta o pecado como um problema real?','Qual é o lugar de Jesus no evangelho?','Como a graça se relaciona com a nova vida?'],conclusion:'Retome os quatro encontros e mostre como as passagens formam um percurso. Reserve espaço para perguntas e para continuar estudando a Bíblia com a comunidade.',prayer:'Deus, dá-nos entendimento da tua Palavra, fé em Cristo e disposição para viver de modo coerente com o evangelho. Amém.',refs:'Gênesis 1–3; Romanos 3–5; 1 Coríntios 15; Efésios 2.'},
{id:'serie-jesus',title:'Série: Encontros com Jesus',text:'Curso em 4 encontros',kind:'Série',series:'Ensinamentos de Jesus',objective:'Estudar quatro episódios dos Evangelhos e observar como Jesus revela o reino de Deus e chama as pessoas à fé e à prática.',truth:'Os encontros com Jesus confrontam nossas expectativas e nos chamam a responder à sua palavra.',intro:'Leia cada episódio completo e situe-o na narrativa do Evangelho antes de discutir aplicações.',context:'Série que pode ser usada em quatro aulas de EBD ou pequenos grupos, com uma passagem principal por encontro.',points:[['Encontro 1 — Nicodemos e o novo nascimento','Texto: João 3:1–21. Foque a necessidade de nascer do alto e a iniciativa de Deus.'],['Encontro 2 — A mulher samaritana','Texto: João 4:1–30, 39–42. Observe como Jesus atravessa barreiras e conduz a conversa à verdadeira adoração.'],['Encontro 3 — Zaqueu','Texto: Lucas 19:1–10. Observe a iniciativa de Jesus e os sinais concretos de mudança na resposta de Zaqueu.'],['Encontro 4 — Tomé e a fé','Texto: João 20:24–29. Considere a dúvida de Tomé no contexto do testemunho da ressurreição.']],application:'Em cada encontro, pergunte: o que o texto revela sobre Jesus, como as pessoas respondem e que resposta o próprio texto convida o leitor a considerar?',questions:['Que surpresa aparece em cada encontro?','Como Jesus conduz cada pessoa à compreensão?','Quais aplicações vêm do texto, e quais seriam apenas nossas suposições?'],conclusion:'Compare as quatro narrativas: cada pessoa chega com uma situação diferente, mas o texto chama o leitor a considerar a identidade de Jesus e a resposta adequada.',prayer:'Senhor Jesus, ajuda-nos a ouvir tua Palavra com humildade, compreender quem tu és e responder com fé e obediência. Amém.',refs:'João 3–4; Lucas 19:1–10; João 20:24–29.'}
];
let current=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const k=$('#kind').value,s=$('#search').value.toLocaleLowerCase('pt-BR');const list=studies.filter(x=>(!k||x.kind===k)&&(!s||(x.title+' '+x.text+' '+x.series).toLocaleLowerCase('pt-BR').includes(s)));$('#cards').innerHTML=list.map(x=>'<div class="card"><span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h2>'+esc(x.title)+'</h2><p><strong>Texto:</strong> '+esc(x.text)+'</p><p>'+esc(x.truth)+'</p><button class="primary" data-id="'+esc(x.id)+'">Abrir estudo completo →</button></div>').join('')||'<p>Nenhum estudo encontrado. Tente outra pesquisa.</p>'}function openStudy(id){current=studies.find(x=>x.id===id);if(!current)return;$('#catalog').classList.add('hidden');$('#detail').classList.remove('hidden');const x=current;$('#detail').innerHTML='<span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h1>'+esc(x.title)+'</h1><p><strong>Texto principal:</strong> '+esc(x.text)+'</p><div class="truth"><strong>Verdade central</strong><br>'+esc(x.truth)+'<br><br><strong>Objetivo</strong><br>'+esc(x.objective)+'</div><section><h2>1. Introdução</h2><p>'+esc(x.intro)+'</p></section><section><h2>2. Contexto bíblico</h2><p>'+esc(x.context)+'</p></section><section><h2>3. Desenvolvimento do estudo</h2>'+x.points.map(p=>'<h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p>').join('')+'</section><section><h2>4. Aplicações práticas</h2><p>'+esc(x.application)+'</p></section><section><h2>5. Perguntas para a turma</h2><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol></section><section><h2>6. Conclusão</h2><p>'+esc(x.conclusion)+'</p></section><section><h2>7. Oração sugerida</h2><p>'+esc(x.prayer)+'</p></section><section><h2>Leituras complementares</h2><p>'+esc(x.refs)+'</p></section><div class="top no-print"><button class="soft" id="back">← Voltar aos estudos</button><button class="gold" id="pr r o estudo.')}}}$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openStudy(b.dataset.id)});$('#kind').onchange=render;$('#search').oninput=render;$('#print').onclick=()=>window.print();$('#copy').onclick=copyStudy;render();
