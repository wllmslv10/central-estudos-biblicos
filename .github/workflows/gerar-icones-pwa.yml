name: Gerar ícones PNG do PWA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gerar-icones-pwa.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - name: Criar ícones PNG reais
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          os.makedirs('.', exist_ok=True)
          for size in (192, 512):
              im = Image.new('RGB', (size, size), '#101d35')
              d = ImageDraw.Draw(im)
              # Moldura arredondada dourada suave e símbolo de Bíblia aberta
              m = int(size * .12)
              d.rounded_rectangle((m, m, size-m, size-m), radius=int(size*.12), outline='#d9b66d', width=max(2,size//64))
              cx=size//2
              # livro aberto
              top=int(size*.34); bottom=int(size*.67)
              d.polygon([(cx,top+size*.04),(cx-size*.27,top),(cx-size*.27,bottom),(cx,bottom-size*.02)], fill='#f5f3ee')
              d.polygon([(cx,top+size*.04),(cx+size*.27,top),(cx+size*.27,bottom),(cx,bottom-size*.02)], fill='#ffffff')
              d.line((cx,top+size*.04,cx,bottom-size*.02), fill='#d9b66d', width=max(2,size//80))
              # cruz dourada central acima do livro
              cw=max(5,int(size*.045)); ch=int(size*.19); yy=int(size*.19)
              d.rounded_rectangle((cx-cw//2,yy,cx+cw//2,yy+ch),radius=max(2,size//100),fill='#d9b66d')
              d.rounded_rectangle((cx-int(size*.09),yy+int(size*.055),cx+int(size*.09),yy+int(size*.11)),radius=max(2,size//100),fill='#d9b66d')
              try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(size*.095))
              except: font=ImageFont.load_default()
              label='CEB'; box=d.textbbox((0,0),label,font=font); tw=box[2]-box[0]
              d.text(((size-tw)/2,int(size*.76)),label,font=font,fill='#d9b66d')
              im.save(f'icon-{size}.png', format='PNG', optimize=True)
          PY
      - name: Publicar ícones gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Adicionar ícones PNG compatíveis com instalação PWA" && git push)
