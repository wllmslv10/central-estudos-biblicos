<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pregações Prontas | Central de Estudos Bíblicos</title>
<style>:root{--n:#101d35;--g:#d9b66d;--bg:#f5f3ee;--line:#dfe3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202a39;font:16px/1.6 system-ui,Arial}header{background:linear-gradient(130deg,#101d35,#1b2d4c);color:white;padding:25px max(18px,calc((100% - 1000px)/2));border-bottom:4px solid var(--g)}.wrap{max-width:1000px;margin:22px auto;padding:0 16px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button,.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--n);color:white}.soft{background:#e4e7ec;color:var(--n)}.gold{background:var(--g);color:var(--n)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:16px}input,select{width:100%;padding:11px;border:1px solid #cbd2dc;border-radius:9px;font:inherit}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}.card,.detail{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.tag{display:inline-block;background:#f2e8cf;color:#6d5017;padding:3px 9px;border-radius:20px;font-size:.8rem;font-weight:bold}.truth{border-left:4px solid var(--g);padding:12px;background:#fff8e7}.hidden{display:none!important}.detail h2{color:var(--n);margin-top:24px}.muted{color:#687386}@media(max-width:650px){.filters{grid-template-columns:1fr}}@media print{header,.top,.filters,.cards,.no-print{display:none!important}body{background:white}.wrap{margin:0;padding:0}.detail{border:0;padding:0}.detail section{break-inside:avoid}}</style></head><body><header><h1>🎙️ Pregações Prontas</h1><p>Esboços bíblicos para preparar, adaptar e compartilhar a mensagem.</p></header><main class="wrap"><div class="top"><a class="btn soft" href="./index.html">← Página inicial</a><a class="btn soft" href="./estudos-prontos.html">📚 Estudos Prontos</a></div><div id="catalog"><div class="filters no-print"><input id="search" placeholder="Pesquisar título, texto bíblico ou tema"><select id="kind"><option value="">Todos os tipos</option><option>Expositiva</option><option>Temática</option><option>Temática/Tópica</option></select></div><p id="count" class="muted"></p><div id="cards" class="cards"></div></div><article id="detail" class="detail hidden"></article></main>
<script>
const sermons=[{"id":"salmo-23","title":"O Senhor é o meu Pastor","text":"Salmo 23","kind":"Expositiva","series":"Confiança em Deus","objective":"Conduzir a igreja a confiar no cuidado e na presença do Senhor.","truth":"O Senhor cuida e permanece presente mesmo nos vales difíceis.","intro":"Todos atravessamos momentos tranquilos e vales de incerteza. O Salmo 23 não promete ausência de dificuldades; apresenta o Deus que acompanha seu povo.","context":"O salmo usa a imagem do pastor para falar de cuidado, provisão e direção. A cena passa das pastagens ao vale escuro e à mesa de acolhimento.","points":[["1. O Pastor provê (vv. 1–3)","O salmista descreve descanso, sustento e direção. A provisão divina inspira confiança e gratidão."],["2. O Pastor acompanha no vale (v. 4)","A presença de Deus não elimina todo sofrimento, mas sustenta seu povo durante a caminhada."],["3. O Senhor acolhe e dá esperança (vv. 5–6)","A mesa e a bondade retratam acolhimento e esperança de comunhão com Deus."]],"application":"Ore pelas dificuldades da igreja e procure maneiras concretas de cuidar de quem atravessa um vale.","questions":["Em que parte do salmo você precisa confiar hoje?","Como confiar em Deus sem negar o sofrimento?","Quem precisa de nosso cuidado nesta semana?"],"conclusion":"O vale é real, mas não estamos abandonados: o Senhor é Pastor também nos caminhos difíceis.","prayer":"Senhor, guia-nos, sustenta-nos nos vales e faz de nós instrumentos de cuidado. Amém.","refs":"Salmo 23; João 10:11–14; Romanos 8:35–39."},{"id":"graca","title":"Salvos pela graça, chamados para boas obras","text":"Efésios 2:1–10","kind":"Expositiva","series":"Fundamentos da fé","objective":"Explicar que a salvação é dádiva da graça e produz uma vida transformada.","truth":"Somos salvos pela graça, não por mérito, e chamados a viver boas obras.","intro":"Muitas pessoas tentam provar seu valor. Efésios 2 mostra a iniciativa misericordiosa de Deus em Cristo.","context":"Paulo contrasta a antiga condição marcada pelo pecado com a nova vida recebida pela graça, afastando a vanglória humana.","points":[["1. Reconheça a necessidade da graça (vv. 1–3)","O texto destaca a seriedade do pecado e nossa necessidade da ação de Deus."],["2. Contemple a misericórdia divina (vv. 4–7)","Por grande amor, Deus dá vida com Cristo."],["3. Viva a nova vocação (vv. 8–10)","As boas obras não compram a salvação; são fruto da nova vida que Deus concede."]],"application":"Evite tanto o orgulho religioso quanto a ideia de que as obras não importam. A graça move ao amor e ao serviço.","questions":["Por que não podemos nos gloriar?","O que significa ser salvo pela graça?","Como as boas obras demonstram transformação?"],"conclusion":"A graça nos salva sem mérito e nos transforma para refletir o caráter de Cristo.","prayer":"Deus, obrigado por tua graça em Cristo. Conduze-nos a uma vida de amor e serviço. Amém.","refs":"Efésios 2:1–10; Romanos 3:21–28; Tito 3:4–8."},{"id":"servir","title":"A grandeza que se ajoelha para servir","text":"Marcos 10:35–45; João 13:1–17","kind":"Temática","series":"Discipulado","objective":"Mostrar que a liderança cristã é moldada pelo serviço humilde de Jesus.","truth":"No Reino de Deus, a grandeza se manifesta no serviço e no amor sacrificial.","intro":"O mundo mede grandeza por posição e reconhecimento. Jesus redefine grandeza e demonstra seu ensino servindo.","context":"Em Marcos, os discípulos buscam posições de honra. Em João, Jesus lava os pés deles e deixa um exemplo concreto.","points":[["1. A ambição pode distorcer o discipulado (Marcos 10:35–41)","Os discípulos ainda pensavam em termos de status."],["2. Jesus redefine a grandeza (Marcos 10:42–45)","Em vez de dominar, os discípulos são chamados a servir."],["3. Jesus transforma ensino em exemplo (João 13:1–17)","O amor se expressa em ações humildes, não apenas em discursos."]],"application":"Escolha uma necessidade que possa atender sem exigir reconhecimento. Líderes devem usar autoridade para cuidar.","questions":["Como o mundo mede grandeza?","O que Jesus ensina sobre autoridade?","Que serviço podemos realizar nesta semana?"],"conclusion":"Seguir Jesus é aprender a servir, inclusive quando ninguém está aplaudindo.","prayer":"Jesus, forma em nós um coração humilde, disposto a servir e amar como tu nos amaste. Amém.","refs":"Marcos 10:35–45; João 13:1–17; Filipenses 2:3–8."},
{"id":"quando-deus-parece-demorar","title":"Quando Deus parece demorar","text":"João 11:1–44; Salmo 13","kind":"Temática","series":"Fé em tempos difíceis","objective":"Ajudar a igreja a confiar no caráter e no tempo de Deus mesmo quando a resposta não chega como esperamos.","truth":"A demora que percebemos não significa ausência de amor ou falta de poder da parte de Deus.","intro":"Há momentos em que oramos e a resposta parece tardar. João 11 apresenta uma família amada por Jesus que atravessa luto, perguntas e espera.","context":"Lázaro adoece e suas irmãs mandam avisar Jesus. Ele não chega imediatamente; quando chega, Lázaro já está morto. O relato revela tanto a humanidade de Jesus diante do sofrimento quanto sua autoridade sobre a morte.","points":[["1. Leve sua dor ao Senhor (João 11:1–3)","As irmãs comunicam a Jesus a necessidade que enfrentam. A fé não exige esconder a tristeza; podemos apresentar ao Senhor nossa dor com sinceridade."],["2. Não confunda demora com falta de amor (João 11:4–16)","O texto afirma o amor de Jesus por aquela família, mesmo quando sua ação não corresponde à expectativa delas. Não conhecemos todos os propósitos de Deus enquanto esperamos."],["3. Confesse sua fé em meio às perguntas (João 11:17–27)","Marta expressa sua tristeza, mas também declara sua confiança em Jesus. Fé bíblica não é ausência de perguntas; é levar as perguntas a Cristo."],["4. Olhe para Cristo, a ressurreição e a vida (João 11:28–44)","Jesus chora com os enlutados e demonstra sua autoridade. O sinal aponta para sua identidade e para a esperança que vence a morte."]],"application":"Ore com sinceridade, acompanhe quem está sofrendo e evite prometer que Deus responderá exatamente como desejamos. Nossa esperança está no caráter de Cristo.","questions":["Tenho interpretado o silêncio como abandono?","Como Jesus demonstra compaixão diante do sofrimento?","Como posso apoiar alguém que está esperando uma resposta?"],"conclusion":"Não entendemos todos os tempos de Deus, mas podemos levar a ele nossa dor e descansar em quem Jesus é.","prayer":"Senhor, sustenta nossa fé quando não entendemos teus caminhos. Consola os que sofrem e ajuda-nos a confiar em Cristo. Amém.","refs":"João 11:1–44; Salmo 13; Romanos 8:31–39."},
{"id":"uma-fe-que-persevera","title":"Uma fé que persevera","text":"Hebreus 10:19–25; 12:1–3","kind":"Temática","series":"Vida cristã","objective":"Encorajar os cristãos a perseverar na fé, na comunhão e na esperança em Cristo.","truth":"Perseveramos olhando para Jesus e caminhando com o povo de Deus.","intro":"Começar uma caminhada pode ser empolgante; permanecer fiel quando surgem cansaço, oposição e desânimo exige raízes profundas.","context":"Hebreus encoraja cristãos pressionados a não abandonar sua confiança. O autor une acesso a Deus por Cristo, comunhão entre irmãos e perseverança com os olhos fixos em Jesus.","points":[["1. Aproxime-se de Deus com confiança (Hebreus 10:19–22)","Nossa aproximação não depende de mérito próprio, mas da obra de Jesus. A perseverança começa voltando continuamente ao Senhor."],["2. Segure firme a esperança (Hebreus 10:23)","A esperança cristã repousa na fidelidade daquele que fez a promessa, não na estabilidade das circunstâncias."],["3. Fortaleça os irmãos e não abandone a comunhão (Hebreus 10:24–25)","A vida cristã não foi planejada para o isolamento. Reunir-se, encorajar e estimular ao amor são meios de sustento espiritual."],["4. Corra olhando para Jesus (Hebreus 12:1–3)","Deixamos o peso que nos atrapalha e perseveramos considerando Cristo, que suportou a cruz e venceu."]],"application":"Retome hábitos simples de oração e leitura bíblica, participe da comunhão da igreja e procure alguém que precise de encorajamento nesta semana.","questions":["O que tem pesado e atrapalhado minha caminhada?","Por que a fidelidade de Deus sustenta nossa esperança?","Quem posso encorajar de maneira concreta?"],"conclusion":"A perseverança não é força isolada: aproximamo-nos de Deus, caminhamos juntos e mantemos os olhos em Jesus.","prayer":"Pai, renova nossa esperança, firma nossos passos e faz de nós irmãos que encorajam uns aos outros. Amém.","refs":"Hebreus 10:19–25; Hebreus 12:1–3; Gálatas 6:9."},
{"id":"familia-que-serve-ao-senhor","title":"Eu e minha casa serviremos ao Senhor","text":"Josué 24:14–24; Deuteronômio 6:4–9","kind":"Temática","series":"Família e discipulado","objective":"Mostrar que a fé precisa orientar as escolhas da família e ser ensinada no cotidiano.","truth":"Servir ao Senhor envolve uma decisão consciente e uma vida diária que transmite a fé às próximas gerações.","intro":"A fé não deve ficar restrita ao culto ou a palavras bonitas. Ela influencia prioridades, conversas, decisões e a maneira como tratamos uns aos outros em casa.","context":"Em Josué 24, o povo é chamado a decidir a quem servirá após recordar a fidelidade de Deus. Deuteronômio 6 orienta Israel a guardar a Palavra e ensiná-la na rotina familiar.","points":[["1. Lembre-se do que Deus já fez (Josué 24:1–13)","Josué relembra a história da graça e da provisão de Deus. A obediência nasce como resposta agradecida, não como tentativa de comprar o favor divino."],["2. Escolha servir ao Senhor com sinceridade (Josué 24:14–18)","O povo é chamado a abandonar outros deuses e servir ao Senhor. A decisão precisa ser verdadeira, não apenas uma declaração pública."],["3. Faça da Palavra parte da vida cotidiana (Deuteronômio 6:4–7)","O ensino bíblico acontece também nas conversas e atividades comuns. A família aprende quando vê a Palavra aplicada com coerência."],["4. Viva uma fé que possa ser observada (Josué 24:19–24)","O compromisso exige seriedade e fidelidade. Pais e responsáveis não controlam todas as escolhas dos familiares, mas podem ensinar, orar e dar exemplo."]],"application":"Escolha um momento regular para ler a Bíblia e orar em família. Converse sobre como a Palavra orienta decisões concretas e peça perdão quando falhar no exemplo.","questions":["Que prioridades mostram a quem servimos?","Como podemos ensinar a Bíblia sem transformar isso apenas em obrigação?","Que atitude prática pode fortalecer a fé em casa esta semana?"],"conclusion":"Uma casa que serve ao Senhor é formada por decisões renovadas e por uma fé vivida no cotidiano, com dependência da graça de Deus.","prayer":"Senhor, orienta nossas famílias pela tua Palavra. Ajuda-nos a servir-te com sinceridade e a demonstrar a fé por meio do amor e do exemplo. Amém.","refs":"Josué 24:14–24; Deuteronômio 6:4–9; Salmo 78:1–7."},{"id":"esperanca-que-nao-decepciona","title":"A esperança que não decepciona","text":"Romanos 5:1–5; 8:18–25","kind":"Temática/Tópica","series":"Esperança cristã","objective":"Encorajar a igreja a permanecer esperançosa nas aflições.","truth":"Nossa esperança repousa no Deus fiel que nos reconciliou consigo e cumprirá suas promessas.","intro":"A esperança cristã não é otimismo vazio; nasce da reconciliação com Deus e da confiança em sua Palavra.","context":"Paulo une paz com Deus, perseverança nas tribulações e a expectativa da redenção futura.","points":[["1. Descanse na paz conquistada por Cristo","Nossa esperança começa na obra de Jesus, não no controle das circunstâncias."],["2. Persevere sem romantizar o sofrimento","A tribulação pode produzir perseverança e caráter, sem que precisemos negar a dor ou deixar de buscar ajuda."],["3. Lembre-se do amor de Deus","O Espírito confirma que não estamos abandonados e sustenta nossa confiança."],["4. Aguarde com paciência a promessa","Ainda esperamos a plenitude da redenção; o futuro de Deus dá perspectiva ao presente."]],"application":"Ore sobre uma preocupação concreta e procure encorajar alguém desanimado.","questions":["O que diferencia esperança bíblica de pensamento positivo?","Como perseverar sem fingir que não dói?","Quem precisa receber encorajamento nesta semana?"],"conclusion":"A esperança não depende de uma vida sem sofrimento, mas do Deus fiel que concluirá sua obra.","prayer":"Pai, firma nossa esperança em Cristo e ajuda-nos a encorajar quem está cansado. Amém.","refs":"Romanos 5:1–5; 8:18–25; 1 Pedro 1:3–9."},{"id":"quando-o-medo-bate-a-porta","title":"Quando o medo bate à porta","text":"Salmo 56:1–13; Isaías 41:8–10","kind":"Temática/Tópica","series":"Confiança em Deus","objective":"Ensinar a levar os medos a Deus e agir com confiança e prudência.","truth":"A fé não significa nunca sentir medo, mas confiar no Senhor e buscar nele força para o próximo passo.","intro":"A Bíblia não nos manda fingir coragem; ensina a levar o temor à presença de Deus.","context":"O Salmo 56 é a oração de alguém ameaçado que escolhe confiar. Isaías 41 destaca a presença e o auxílio de Deus.","points":[["1. Reconheça o medo diante de Deus","A oração sincera não precisa esconder a fragilidade."],["2. Alimente a mente com a Palavra","Lembrar quem Deus é impede que o medo seja a única voz ouvida."],["3. Apoie-se na presença do Senhor","Deus sustenta seu povo; isso não significa ausência de problemas, mas presença fiel."],["4. Dê o próximo passo com sabedoria","A confiança pode caminhar junto com prudência e busca de ajuda."]],"application":"Nomeie diante de Deus o que causa medo e procure apoio confiável quando necessário.","questions":["O que faço quando o medo aparece?","Que verdades sobre Deus devo lembrar?","Qual é o próximo passo prudente?"],"conclusion":"Coragem bíblica é caminhar apoiado no Senhor, mesmo quando sentimos medo.","prayer":"Senhor, conhece nossos temores. Ajuda-nos a confiar em ti e agir com sabedoria. Amém.","refs":"Salmo 56:1–13; Isaías 41:8–10; Salmo 27:1–5."},{"id":"perdao-que-liberta","title":"O perdão que liberta","text":"Efésios 4:31–32; Colossenses 3:12–15","kind":"Temática/Tópica","series":"Relacionamentos cristãos","objective":"Mostrar que o perdão nasce da graça e conduz a relacionamentos tratados com verdade.","truth":"Recebemos a graça de Deus e somos chamados a abandonar a vingança, sem confundir perdão com ausência de justiça ou limites.","intro":"Perdoar não é fingir que nada aconteceu, mas responder à ofensa à luz da graça de Cristo.","context":"Paulo chama a igreja a abandonar práticas antigas e revestir-se do caráter de Cristo; o padrão é a graça recebida do Senhor.","points":[["1. Reconheça o dano com honestidade","Perdoar não exige negar a gravidade da ofensa."],["2. Lembre-se da graça recebida","A compaixão cristã se fundamenta no modo como Deus nos tratou em Cristo."],["3. Abandone a vingança e busque a paz","A reconciliação pode exigir arrependimento, tempo e reconstrução da confiança."],["4. Pratique a verdade com limites sábios","Perdão não obriga a permanecer em situação abusiva ou perigosa; proteção e ajuda podem ser necessárias."]],"application":"Considere um passo seguro: orar, buscar aconselhamento, estabelecer limites ou conversar quando houver condições.","questions":["Por que o perdão começa pela graça?","Perdoar é o mesmo que restaurar imediatamente a confiança?","Que limites podem ser necessários para segurança?"],"conclusion":"O perdão não chama o mal de bem; recusa a vingança e busca verdade, graça e justiça.","prayer":"Senhor, ajuda-nos a tratar as feridas com verdade e buscar caminhos seguros de paz. Amém.","refs":"Efésios 4:31–32; Colossenses 3:12–15; Romanos 12:17–21."},{"id":"servir-quando-ninguem-ve","title":"Servir quando ninguém está vendo","text":"Mateus 6:1–6; Colossenses 3:23–24","kind":"Temática/Tópica","series":"Caráter cristão","objective":"Motivar a igreja a servir com fidelidade sem depender de aplausos.","truth":"O valor do serviço cristão depende da sinceridade diante do Senhor, não do reconhecimento humano.","intro":"O desafio é continuar fazendo o bem quando ninguém agradece.","context":"Jesus alerta contra práticas religiosas para receber elogios; Paulo ensina a trabalhar de coração como para o Senhor.","points":[["1. Examine a motivação do coração","Jesus confronta ações cujo objetivo é obter aprovação humana."],["2. Cultive devoção sincera","Oração e generosidade não devem virar espetáculo; o Pai vê o que permanece oculto."],["3. Trabalhe de coração para o Senhor","A fidelidade cotidiana pode ser adoração, mesmo em tarefas pequenas."],["4. Permaneça fiel no serviço simples","A igreja precisa de pessoas que sirvam com humildade e constância."]],"application":"Faça uma tarefa útil sem buscar reconhecimento e agradeça a alguém cujo serviço passa despercebido.","questions":["O que muda quando sirvo para o Senhor?","Como evitar depender de elogios?","Que serviço discreto merece ser valorizado?"],"conclusion":"Deus vê a fidelidade que outros não percebem. Sirvamos com alegria e sinceridade.","prayer":"Pai, purifica nossas motivações e ensina-nos a servir com humildade. Amém.","refs":"Mateus 6:1–6; Colossenses 3:23–24; Gálatas 6:9–10."},{"id":"sabedoria-nas-decisoes","title":"Sabedoria para decidir","text":"Provérbios 3:1–8; Tiago 1:5–8","kind":"Temática/Tópica","series":"Vida cristã","objective":"Orientar decisões com oração, humildade e responsabilidade.","truth":"A sabedoria começa em confiar no Senhor e submeter os caminhos à sua Palavra.","intro":"A Bíblia nos chama a buscar sabedoria, não fórmulas mágicas para cada decisão.","context":"Provérbios apresenta a confiança no Senhor como fundamento da sabedoria; Tiago encoraja a pedir discernimento a Deus.","points":[["1. Confie no Senhor mais que na própria percepção","Nossa visão é limitada; reconhecer isso nos torna ensináveis."],["2. Submeta seus caminhos a Deus","Alinhe escolhas à Palavra e abandone caminhos contrários a ela."],["3. Peça sabedoria com disposição para obedecer","Ore por discernimento para agir fielmente."],["4. Avalie conselhos e consequências","A oração caminha com estudo, conselho maduro e responsabilidade."]],"application":"Anote a decisão, os princípios bíblicos, as opções e os riscos. Ore e procure conselhos confiáveis.","questions":["Qual a diferença entre confiar em Deus e agir sem pensar?","Que princípios bíblicos orientam a decisão?","Quem pode oferecer conselho maduro?"],"conclusion":"Buscar a direção de Deus é confiar nele, ouvir sua Palavra e decidir com humildade e responsabilidade.","prayer":"Senhor, dá-nos sabedoria e guia-nos para escolhas que honrem tua Palavra. Amém.","refs":"Provérbios 3:1–8; Tiago 1:5–8; Salmo 25:4–5."}];const $=s=>document.querySelector(s);let current=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const k=$('#kind').value,q=$('#search').value.toLocaleLowerCase('pt-BR'),a=sermons.filter(x=>(!k||x.kind===k)&&(!q||(x.title+' '+x.text+' '+x.series).toLocaleLowerCase('pt-BR').includes(q)));$('#count').textContent=a.length+' esboço(s) encontrado(s)';$('#cards').innerHTML=a.map(x=>'<div class="card"><span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h2>'+esc(x.title)+'</h2><p><b>Texto:</b> '+esc(x.text)+'</p><p>'+esc(x.truth)+'</p><button class="primary" data-id="'+x.id+'">Abrir esboço completo →</button></div>').join('')||'<p>Nenhum esboço encontrado.</p>'}
function htmlDoc(x){return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>'+esc(x.title)+'</title><style>body{font:16px/1.6 Georgia,serif;max-width:850px;margin:30px auto;padding:0 20px;color:#202a39}h1,h2,h3{font-family:Arial;color:#101d35}.meta,.truth{background:#f5f3ee;padding:12px;border-left:4px solid #d9b66d}.actions{font-family:Arial}button{padding:10px}@media print{.actions{display:none}}</style></head><body><div class="actions"><button onclick="window.print()">Imprimir / salvar PDF</button></div><h1>'+esc(x.title)+'</h1><p><b>Texto bíblico:</b> '+esc(x.text)+'</p><div class="meta"><b>Objetivo:</b> '+esc(x.objective)+'</div><div class="truth"><b>Verdade central:</b> '+esc(x.truth)+'</div><h2>Introdução</h2><p>'+esc(x.intro)+'</p><h2>Contexto bíblico</h2><p>'+esc(x.context)+'</p><h2>Desenvolvimento</h2>'+x.points.map(p=>'<h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p>').join('')+'<h2>Aplicação</h2><p>'+esc(x.application)+'</p><h2>Perguntas</h2><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol><h2>Conclusão</h2><p>'+esc(x.conclusion)+'</p><h2>Oração sugerida</h2><p>'+esc(x.prayer)+'</p><h2>Referências</h2><p>'+esc(x.refs)+'</p><script src="'+new URL('./biblia.js?v=7',location.href).href+'"><\/script></body></html>'}
function openSermon(id){current=sermons.find(x=>x.id===id);const x=current;$('#catalog').classList.add('hidden');$('#detail').classList.remove('hidden');$('#detail').innerHTML='<span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h1>'+esc(x.title)+'</h1><p><b>Texto bíblico:</b> '+esc(x.text)+'</p><div class="truth"><b>Objetivo:</b> '+esc(x.objective)+'<br><br><b>Verdade central:</b> '+esc(x.truth)+'</div><section><h2>1. Introdução</h2><p>'+esc(x.intro)+'</p></section><section><h2>2. Contexto bíblico</h2><p>'+esc(x.context)+'</p></section><section><h2>3. Desenvolvimento do esboço</h2>'+x.points.map(p=>'<h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p>').join('')+'</section><section><h2>4. Aplicação</h2><p>'+esc(x.application)+'</p></section><section><h2>5. Perguntas para reflexão</h2><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol></section><section><h2>6. Conclusão</h2><p>'+esc(x.conclusion)+'</p></section><section><h2>7. Oração sugerida</h2><p>'+esc(x.prayer)+'</p></section><section><h2>Referências complementares</h2><p>'+esc(x.refs)+'</p></section><div class="top no-print"><button class="soft" id="back">← Voltar</button><button class="gold" id="print">🖨️ Imprimir / salvar PDF</button><button class="primary" id="viewHtml">👁️ Ver HTML</button><button class="gold" id="download">🧾 Gerar / baixar HTML</button></div>';$('#back').onclick=()=>{ $('#detail').classList.add('hidden');$('#catalog').classList.remove('hidden')};$('#print').onclick=()=>window.print();$('#viewHtml').onclick=()=>{const u=URL.createObjectURL(new Blob([htmlDoc(x)],{type:'text/html;charset=utf-8'}));const w=window.open(u,'_blank');if(!w){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click()}setTimeout(()=>URL.revokeObjectURL(u),60000)};$('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([htmlDoc(x)],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='pregacao-'+x.id+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)};window.scrollTo(0,0)}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openSermon(b.dataset.id)});$('#kind').onchange=render;$('#search').oninput=render;render();
</script></body></html>
