<!doctype html>
<!-- versao-publicada: 2026-10-23-pregacoes-prontas-v1 -->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pregações Prontas | Central de Estudos Bíblicos</title>
<style>:root{--n:#101d35;--g:#d9b66d;--bg:#f5f3ee;--line:#dfe3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202a39;font:16px/1.6 system-ui,Arial}header{background:linear-gradient(130deg,#101d35,#1b2d4c);color:white;padding:25px max(18px,calc((100% - 1000px)/2));border-bottom:4px solid var(--g)}.wrap{max-width:1000px;margin:22px auto;padding:0 16px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button,.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--n);color:white}.soft{background:#e4e7ec;color:var(--n)}.gold{background:var(--g);color:var(--n)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:16px}input,select{width:100%;padding:11px;border:1px solid #cbd2dc;border-radius:9px;font:inherit}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}.card,.detail{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.tag{display:inline-block;background:#f2e8cf;color:#6d5017;padding:3px 9px;border-radius:20px;font-size:.8rem;font-weight:bold}.truth{border-left:4px solid var(--g);padding:12px;background:#fff8e7}.hidden{display:none!important}.detail h2{color:var(--n);margin-top:24px}.muted{color:#687386}@media(max-width:650px){.filters{grid-template-columns:1fr}}@media print{header,.top,.filters,.cards,.no-print{display:none!important}body{background:white}.wrap{margin:0;padding:0}.detail{border:0;padding:0}.detail section{break-inside:avoid}}</style></head><body><header><h1>🎙️ Pregações Prontas</h1><p>Esboços bíblicos para preparar, adaptar e compartilhar a mensagem.</p></header><main class="wrap"><div class="top"><a class="btn soft" href="./index.html">← Página inicial</a><a class="btn soft" href="./estudos-prontos.html">📚 Estudos Prontos</a></div><div id="catalog"><div class="filters no-print"><input id="search" placeholder="Pesquisar título, texto bíblico ou tema"><select id="kind"><option value="">Todos os tipos</option><option>Expositiva</option><option>Temática</option></select></div><p id="count" class="muted"></p><div id="cards" class="cards"></div></div><article id="detail" class="detail hidden"></article></main>
<script>
const sermons=[{"id":"salmo-23","title":"O Senhor é o meu Pastor","text":"Salmo 23","kind":"Expositiva","series":"Confiança em Deus","objective":"Conduzir a igreja a confiar no cuidado e na presença do Senhor.","truth":"O Senhor cuida e permanece presente mesmo nos vales difíceis.","intro":"Todos atravessamos momentos tranquilos e vales de incerteza. O Salmo 23 não promete ausência de dificuldades; apresenta o Deus que acompanha seu povo.","context":"O salmo usa a imagem do pastor para falar de cuidado, provisão e direção. A cena passa das pastagens ao vale escuro e à mesa de acolhimento.","points":[["1. O Pastor provê (vv. 1–3)","O salmista descreve descanso, sustento e direção. A provisão divina inspira confiança e gratidão."],["2. O Pastor acompanha no vale (v. 4)","A presença de Deus não elimina todo sofrimento, mas sustenta seu povo durante a caminhada."],["3. O Senhor acolhe e dá esperança (vv. 5–6)","A mesa e a bondade retratam acolhimento e esperança de comunhão com Deus."]],"application":"Ore pelas dificuldades da igreja e procure maneiras concretas de cuidar de quem atravessa um vale.","questions":["Em que parte do salmo você precisa confiar hoje?","Como confiar em Deus sem negar o sofrimento?","Quem precisa de nosso cuidado nesta semana?"],"conclusion":"O vale é real, mas não estamos abandonados: o Senhor é Pastor também nos caminhos difíceis.","prayer":"Senhor, guia-nos, sustenta-nos nos vales e faz de nós instrumentos de cuidado. Amém.","refs":"Salmo 23; João 10:11–14; Romanos 8:35–39."},{"id":"graca","title":"Salvos pela graça, chamados para boas obras","text":"Efésios 2:1–10","kind":"Expositiva","series":"Fundamentos da fé","objective":"Explicar que a salvação é dádiva da graça e produz uma vida transformada.","truth":"Somos salvos pela graça, não por mérito, e chamados a viver boas obras.","intro":"Muitas pessoas tentam provar seu valor. Efésios 2 mostra a iniciativa misericordiosa de Deus em Cristo.","context":"Paulo contrasta a antiga condição marcada pelo pecado com a nova vida recebida pela graça, afastando a vanglória humana.","points":[["1. Reconheça a necessidade da graça (vv. 1–3)","O texto destaca a seriedade do pecado e nossa necessidade da ação de Deus."],["2. Contemple a misericórdia divina (vv. 4–7)","Por grande amor, Deus dá vida com Cristo."],["3. Viva a nova vocação (vv. 8–10)","As boas obras não compram a salvação; são fruto da nova vida que Deus concede."]],"application":"Evite tanto o orgulho religioso quanto a ideia de que as obras não importam. A graça move ao amor e ao serviço.","questions":["Por que não podemos nos gloriar?","O que significa ser salvo pela graça?","Como as boas obras demonstram transformação?"],"conclusion":"A graça nos salva sem mérito e nos transforma para refletir o caráter de Cristo.","prayer":"Deus, obrigado por tua graça em Cristo. Conduze-nos a uma vida de amor e serviço. Amém.","refs":"Efésios 2:1–10; Romanos 3:21–28; Tito 3:4–8."},{"id":"servir","title":"A grandeza que se ajoelha para servir","text":"Marcos 10:35–45; João 13:1–17","kind":"Temática","series":"Discipulado","objective":"Mostrar que a liderança cristã é moldada pelo serviço humilde de Jesus.","truth":"No Reino de Deus, a grandeza se manifesta no serviço e no amor sacrificial.","intro":"O mundo mede grandeza por posição e reconhecimento. Jesus redefine grandeza e demonstra seu ensino servindo.","context":"Em Marcos, os discípulos buscam posições de honra. Em João, Jesus lava os pés deles e deixa um exemplo concreto.","points":[["1. A ambição pode distorcer o discipulado (Marcos 10:35–41)","Os discípulos ainda pensavam em termos de status."],["2. Jesus redefine a grandeza (Marcos 10:42–45)","Em vez de dominar, os discípulos são chamados a servir."],["3. Jesus transforma ensino em exemplo (João 13:1–17)","O amor se expressa em ações humildes, não apenas em discursos."]],"application":"Escolha uma necessidade que possa atender sem exigir reconhecimento. Líderes devem usar autoridade para cuidar.","questions":["Como o mundo mede grandeza?","O que Jesus ensina sobre autoridade?","Que serviço podemos realizar nesta semana?"],"conclusion":"Seguir Jesus é aprender a servir, inclusive quando ninguém está aplaudindo.","prayer":"Jesus, forma em nós um coração humilde, disposto a servir e amar como tu nos amaste. Amém.","refs":"Marcos 10:35–45; João 13:1–17; Filipenses 2:3–8."}];const $=s=>document.querySelector(s);let current=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const k=$('#kind').value,q=$('#search').value.toLocaleLowerCase('pt-BR'),a=sermons.filter(x=>(!k||x.kind===k)&&(!q||(x.title+' '+x.text+' '+x.series).toLocaleLowerCase('pt-BR').includes(q)));$('#count').textContent=a.length+' esboço(s) encontrado(s)';$('#cards').innerHTML=a.map(x=>'<div class="card"><span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h2>'+esc(x.title)+'</h2><p><b>Texto:</b> '+esc(x.text)+'</p><p>'+esc(x.truth)+'</p><button class="primary" data-id="'+x.id+'">Abrir esboço completo →</button></div>').join('')||'<p>Nenhum esboço encontrado.</p>'}
function htmlDoc(x){return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>'+esc(x.title)+'</title><style>body{font:16px/1.6 Georgia,serif;max-width:850px;margin:30px auto;padding:0 20px;color:#202a39}h1,h2,h3{font-family:Arial;color:#101d35}.meta,.truth{background:#f5f3ee;padding:12px;border-left:4px solid #d9b66d}.actions{font-family:Arial}button{padding:10px}@media print{.actions{display:none}}</style></head><body><div class="actions"><button onclick="window.print()">Imprimir / salvar PDF</button></div><h1>'+esc(x.title)+'</h1><p><b>Texto bíblico:</b> '+esc(x.text)+'</p><div class="meta"><b>Objetivo:</b> '+esc(x.objective)+'</div><div class="truth"><b>Verdade central:</b> '+esc(x.truth)+'</div><h2>Introdução</h2><p>'+esc(x.intro)+'</p><h2>Contexto bíblico</h2><p>'+esc(x.context)+'</p><h2>Desenvolvimento</h2>'+x.points.map(p=>'<h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p>').join('')+'<h2>Aplicação</h2><p>'+esc(x.application)+'</p><h2>Perguntas</h2><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol><h2>Conclusão</h2><p>'+esc(x.conclusion)+'</p><h2>Oração sugerida</h2><p>'+esc(x.prayer)+'</p><h2>Referências</h2><p>'+esc(x.refs)+'</p></body></html>'}
function openSermon(id){current=sermons.find(x=>x.id===id);const x=current;$('#catalog').classList.add('hidden');$('#detail').classList.remove('hidden');$('#detail').innerHTML='<span class="tag">'+esc(x.kind)+' · '+esc(x.series)+'</span><h1>'+esc(x.title)+'</h1><p><b>Texto bíblico:</b> '+esc(x.text)+'</p><div class="truth"><b>Objetivo:</b> '+esc(x.objective)+'<br><br><b>Verdade central:</b> '+esc(x.truth)+'</div><section><h2>1. Introdução</h2><p>'+esc(x.intro)+'</p></section><section><h2>2. Contexto bíblico</h2><p>'+esc(x.context)+'</p></section><section><h2>3. Desenvolvimento do esboço</h2>'+x.points.map(p=>'<h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p>').join('')+'</section><section><h2>4. Aplicação</h2><p>'+esc(x.application)+'</p></section><section><h2>5. Perguntas para reflexão</h2><ol>'+x.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol></section><section><h2>6. Conclusão</h2><p>'+esc(x.conclusion)+'</p></section><section><h2>7. Oração sugerida</h2><p>'+esc(x.prayer)+'</p></section><section><h2>Referências complementares</h2><p>'+esc(x.refs)+'</p></section><div class="top no-print"><button class="soft" id="back">← Voltar</button><button class="gold" id="print">🖨️ Imprimir / salvar PDF</button><button class="primary" id="download">⬇️ Baixar esboço em HTML</button></div>';$('#back').onclick=()=>{ $('#detail').classList.add('hidden');$('#catalog').classList.remove('hidden')};$('#print').onclick=()=>window.print();$('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([htmlDoc(x)],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='pregacao-'+x.id+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)};window.scrollTo(0,0)}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openSermon(b.dataset.id)});$('#kind').onchange=render;$('#search').oninput=render;render();
</script></body></html>
